name: install_desktop_deps
description: Installe les dépendances système Linux de Tauri (webkit2gtk, PipeWire, PulseAudio…).
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell 2> /dev/null || true
        df -h /
        bash "${GITHUB_WORKSPACE}/scripts/setup-linux-tauri.sh"
        bash "${GITHUB_WORKSPACE}/scripts/setup-linux-others.sh"
