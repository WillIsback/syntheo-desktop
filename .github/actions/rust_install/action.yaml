name: rust_install
description: Installe la toolchain Rust de rust-toolchain.toml et active le cache cargo.
runs:
  using: "composite"
  steps:
    - id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "channel=$(grep 'channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
        echo "components=$(grep 'components' rust-toolchain.toml | sed 's/.*\[//; s/\].*//' | tr -d '" ')" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ steps.toolchain.outputs.components }}

    # Les artefacts de compilation (target/) sont mis en cache par sccache
    # dans le job Rust fusionné ; rust-cache ne conserve ici que le registre
    # Cargo (~/.cargo/registry, ~/.cargo/git) pour éviter de cumuler deux
    # backends sur le même target/.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        cache-targets: "false"
        workspaces: |
          . -> target
          apps/desktop/src-tauri -> target
