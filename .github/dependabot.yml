# Dependabot — mises à jour automatisées des dépendances (versions épinglées)
---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    labels: ["type:chore", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # Avis sans version corrigée publiée ou bloqués par une contrainte amont.
    # Voir .github/security-exceptions.yml (expire le 2027-01-31).
    ignore:
      - dependency-name: "node-forge" # aucun correctif publié (patch local)
      - dependency-name: "extract-zip" # aucun correctif publié (patch local)
      - dependency-name: "zod"
        versions: ["3.x"] # correctif uniquement en 4.x, tiré par des tiers

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    labels: ["type:chore", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    # glib 0.18 est imposé par gtk3-rs / webkit2gtk-4.1 (Tauri).
    # Voir .github/security-exceptions.yml (expire le 2027-01-31).
    ignore:
      - dependency-name: "glib"
        versions: ["0.18.x"]

  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    labels: ["type:chore", "dependencies"]
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 10
    # Une seule PR pour toutes les actions (épinglées par SHA dans plusieurs fichiers).
    groups:
      github-actions:
        patterns: ["*"]
