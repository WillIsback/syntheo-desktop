# Workflow : build-windows
# Compilation des paquets Windows (NSIS + MSI).
# Signature de code via Azure Artifact Signing **si** les secrets Azure sont
# fournis (AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET) ; build non
# signé sinon. Voir docs/desktop-installation.mdx.
name: build-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version injectée dans le bundle"
        type: string
        required: false
        default: "0.0.0"
  workflow_call:
    inputs:
      version:
        description: "Version injectée dans le bundle"
        type: string
        required: true

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        uses: ./.github/actions/rust_install

      - name: Installer Node, pnpm et les dépendances (lockfile figé)
        uses: ./.github/actions/pnpm_install

      - name: Injecter la version dans la configuration Syntheo
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $conf = "apps/desktop/src-tauri/tauri.conf.syntheo.json"
          $json = Get-Content -Raw $conf | ConvertFrom-Json
          $version = if ($env:VERSION) { $env:VERSION -replace '^v', '' } else { "0.0.0" }
          $json | Add-Member -NotePropertyName version -NotePropertyValue $version -Force
          $json | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $conf

      - name: Vérifier l'authentification Azure
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if (-not $env:AZURE_CLIENT_SECRET) { Write-Host "Secrets Azure absents : signature désactivée."; exit 0 }
          az login --service-principal -u $env:AZURE_CLIENT_ID -p $env:AZURE_CLIENT_SECRET -t $env:AZURE_TENANT_ID --only-show-errors
          if ($LASTEXITCODE -ne 0) {
            throw "az login a échoué (code $LASTEXITCODE). Si le message est « No subscriptions found », attribue le rôle Reader au service principal sur le groupe de ressources du compte Artifact Signing (ou sur l'abonnement)."
          }
          Write-Host "Authentification Azure OK."

      - name: Installer artifact-signing-cli
        shell: pwsh
        run: |
          $version = "0.12.0"
          # Somme SHA-256 du binaire publié (vérifiée comme les autres outils de CI).
          $sha256 = "dd6fa95a0367cbd32ea520037c3df72d1ed8f523a5b07883b0c2a4034e918a53"
          $dir = Join-Path $env:RUNNER_TEMP "artifact-signing-cli"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir "artifact-signing-cli.exe"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Levminer/artifact-signing-cli/releases/download/$version/artifact-signing-cli.exe" -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($actual -ne $sha256) { throw "SHA256 invalide pour artifact-signing-cli : $actual" }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build MSI et NSIS (signés si les secrets Azure sont fournis)
        id: build
        shell: bash
        env:
          # Valeur factice exigée par des intégrations cloud héritées (chantier 04d).
          VITE_API_URL: http://127.0.0.1:9
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${AZURE_CLIENT_SECRET:-}" ]; then
            echo "Signature Windows activée."
            echo "signing=true" >> "$GITHUB_OUTPUT"
            extra=(--config ./src-tauri/tauri.windows-signing.conf.json)
          else
            echo "Signature Windows désactivée (secrets Azure absents)."
            echo "signing=false" >> "$GITHUB_OUTPUT"
          fi
          pnpm -F ui build
          pnpm -F desktop tauri build --ci --bundles nsis,msi \
            --config ./src-tauri/tauri.conf.syntheo.json "${extra[@]}"

      - name: Vérifier la signature des installeurs
        if: steps.build.outputs.signing == 'true'
        shell: pwsh
        run: |
          # `Get-AuthenticodeSignature` renvoie `UnknownError` quand la racine de
          # confiance d'Artifact Signing n'est pas (encore) dans le magasin du
          # runner : la chaîne ne se construit pas, mais la signature reste
          # valide. On vérifie donc le signataire et l'horodatage, en acceptant
          # `UnknownError` à côté de `Valid`.
          $files = @(
            Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          )
          $failed = $false
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "aucun" }
            Write-Host "$($file.Name) : status=$($sig.Status) ; horodate=$([bool]$sig.TimeStamperCertificate) ; signataire=$subject"
            if (-not $sig.SignerCertificate) {
              Write-Host "  -> aucun signataire"
              $failed = $true
            } elseif ($sig.Status -notin @("Valid", "UnknownError")) {
              Write-Host "  -> statut inattendu"
              $failed = $true
            } elseif (-not $sig.TimeStamperCertificate) {
              Write-Host "  -> signature non horodatée"
              $failed = $true
            }
          }
          if ($failed) { throw "au moins un installeur n'est pas signé correctement" }

      - name: Rassembler les artefacts et les sommes de contrôle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe dist/
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows
          Get-Content dist/SHA256SUMS-windows

      - name: Upload des artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntheo-desktop-windows
          path: dist/
          retention-days: 14
