# Workflow : SAST (CodeQL)
# Suite security-extended (la qualité est couverte par clippy, oxlint, ESLint).
# - PR : TypeScript seulement, et seulement si la PR en modifie (≈ 3 min).
# - Rust (extraction du workspace + ~1 000 dépendances, > 25 min) : hors PR,
#   comme gate de la release (workflow_call), chaque semaine et à la demande.
name: ci-codeql

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Langages modifiés
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      ts: ${{ steps.diff.outputs.ts }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Détecter les langages touchés
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            # Hors PR (release, planifié, manuel) : analyse complète.
            echo "rust=true" >> "$GITHUB_OUTPUT"; echo "ts=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # PR : jamais de Rust (trop long pour une PR) ; TypeScript si modifié.
          FILES=$(git diff --name-only "$BASE_SHA" HEAD)
          RUST=false
          if grep -qE '\.(ts|tsx|js|jsx|mjs|cjs)$|(^|/)package\.json$|^pnpm-lock\.yaml$|^\.github/workflows/ci-codeql\.yml$' <<<"$FILES"; then TS=true; else TS=false; fi
          echo "rust=$RUST" >> "$GITHUB_OUTPUT"; echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "Rust : $RUST — TypeScript : $TS"

  analyze-ts:
    name: SAST (CodeQL javascript-typescript)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyse CodeQL (upload automatique)
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: "/language:javascript-typescript"

  analyze-rust:
    name: SAST (CodeQL rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended

      - name: Analyse CodeQL (upload automatique)
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: "/language:rust"
