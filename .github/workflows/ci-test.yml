# Workflow : Tests
# Tests unitaires TypeScript (Vitest) et Rust (cargo test), validation YAML
name: ci-test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest:
    name: ci-test (Vitest ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node, pnpm et les dépendances (lockfile figé)
        uses: ./.github/actions/pnpm_install

      - name: Tests du desktop
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          pnpm -F ui build
          pnpm -F desktop test --shard="$SHARD/3" --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - name: Upload des résultats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-results-${{ matrix.shard }}
          path: apps/desktop/junit.xml
          retention-days: 7

  # Les tests Rust sont exécutés dans ci-code-quality (job Rust fusionné), qui
  # compile le workspace une seule fois pour clippy et cargo test. Ce job ne
  # tourne plus sur les PR (trop long) : push main + hebdo + manuel.

  yaml:
    name: ci-test (YAML)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validation YAML des workflows et configs
        shell: bash
        run: |
          set -euo pipefail
          pip install --only-binary :all: "yamllint==1.38.0" -q
          yamllint -d '{"extends": "default", "rules": {"line-length": "disable", "document-start": "disable", "brackets": "disable", "truthy": {"check-keys": false}, "comments": {"min-spaces-from-content": 1}}}' .github/
