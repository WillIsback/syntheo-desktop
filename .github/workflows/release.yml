# Workflow : Release (CD)
# Push sur main ou déclenchement manuel : version semver depuis les commits,
# gates (dont CodeQL Rust, trop long pour les PR), build des paquets Linux,
# SBOM, attestation de provenance, GitHub Release.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de bump (auto = détection automatique)"
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto
      dry_run:
        description: "Mode dry-run (build sans publication)"
        type: boolean
        default: true

concurrency:
  group: release-main
  cancel-in-progress: false # sérialisation stricte

permissions:
  contents: read

jobs:
  detect:
    name: Détection et calcul de version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.calc.outputs.version || 'skipped' }}
      bump: ${{ steps.calc.outputs.bump || 'none' }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Calcul de la version
        id: calc
        shell: bash
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # `[skip release]` ne bloque que les releases automatiques (push) : un
          # déclenchement manuel (workflow_dispatch) est une intention explicite
          # de publier, on l'honore même si le dernier commit porte le marqueur.
          if [ "${{ github.event_name }}" = "push" ] \
            && git log -1 --format=%s | grep -qiE '\[skip release\]'; then
            echo "🔇 Commit marqué [skip release] (push)."
            echo "version=skipped" >> "$GITHUB_OUTPUT"; echo "bump=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          BASE="${LAST_TAG:-v0.0.0}"
          IFS=. read -r MAJOR MINOR PATCH <<<"${BASE#v}"
          if [ -n "${INPUT_BUMP:-}" ] && [ "$INPUT_BUMP" != "auto" ]; then
            BUMP="$INPUT_BUMP"
            echo "ℹ️  Bump forcé : $BUMP"
          else
            # Seuls feat / fix / perf (ou breaking change) déclenchent une release.
            BUMP="none"
            while IFS= read -r COMMIT; do
              [ -z "$COMMIT" ] && continue
              if echo "$COMMIT" | grep -qE '^[a-zA-Z]+(\(.+\))?!:'; then BUMP="major"
              elif echo "$COMMIT" | grep -qE '^feat(\(.+\))?:' && [ "$BUMP" != "major" ]; then BUMP="minor"
              elif echo "$COMMIT" | grep -qE '^(fix|perf)(\(.+\))?:' && [ "$BUMP" = "none" ]; then BUMP="patch"
              fi
            done < <(git log --format=%s "$RANGE")
          fi
          echo "Dernier tag : ${LAST_TAG:-aucun} — bump : $BUMP"
          if [ "$BUMP" = "none" ]; then
            echo "ℹ️  Aucun commit éligible (feat/fix/perf) : pas de release."
            echo "version=skipped" >> "$GITHUB_OUTPUT"; echo "bump=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "Version calculée : $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

  gate-version-consistency:
    name: gate-version-consistency
    needs: detect
    if: needs.detect.outputs.version != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Le tag ne doit pas exister et doit être supérieur au dernier
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "❌ Le tag $VERSION existe déjà."; exit 1
          fi
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")
          HIGHEST=$(printf '%s\n%s\n' "$LAST_TAG" "$VERSION" | sort -V | tail -1)
          [ "$HIGHEST" = "$VERSION" ] && [ "$LAST_TAG" != "$VERSION" ] \
            || { echo "❌ $VERSION n'est pas supérieure à $LAST_TAG."; exit 1; }
          echo "✅ $VERSION > $LAST_TAG"

  build:
    name: Build des paquets Linux
    needs: [detect, gate-version-consistency]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances système Tauri
        uses: ./.github/actions/install_desktop_deps

      - name: Toolchain Rust
        uses: ./.github/actions/rust_install

      - name: Installer Node, pnpm et les dépendances (lockfile figé)
        uses: ./.github/actions/pnpm_install

      - name: Injecter la version dans la configuration Syntheo
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          CONF=apps/desktop/src-tauri/tauri.conf.syntheo.json
          jq --arg v "${VERSION#v}" '.version = $v' "$CONF" > "$CONF.tmp" && mv "$CONF.tmp" "$CONF"

      - name: Build .deb et AppImage
        env:
          # Valeur factice exigée par des intégrations cloud héritées (chantier 04d).
          VITE_API_URL: http://127.0.0.1:9
        run: |
          set -euo pipefail
          pnpm -F ui build
          pnpm -F desktop tauri build --ci --bundles deb,appimage --config ./src-tauri/tauri.conf.syntheo.json

      - name: Rassembler les artefacts et les sommes de contrôle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb dist/
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/
          (cd dist && sha256sum ./* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/syntheo-desktop.spdx.json
          upload-artifact: false

      - name: Upload des artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntheo-desktop-linux
          path: dist/
          retention-days: 14

  # Paquets Windows non signés (NSIS + MSI), en parallèle du build Linux.
  # La signature de code est un chantier séparé ; voir
  # docs/superpowers/plans/2026-10-27-signature-code-macos-windows.md.
  build-windows:
    name: Build des paquets Windows
    needs: [detect, gate-version-consistency]
    if: needs.detect.outputs.version != 'skipped'
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.detect.outputs.version }}

  # Gate SAST lourde (CodeQL Rust + TypeScript), en parallèle du build.
  sast:
    name: Gate SAST (CodeQL)
    needs: [detect, gate-version-consistency]
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: ./.github/workflows/ci-codeql.yml

  publish:
    name: Publication de la release
    needs: [detect, build, build-windows, sast]
    if: |
      needs.detect.outputs.version != 'skipped'
      && (github.event_name != 'workflow_dispatch' || (inputs.dry_run != true && inputs.dry_run != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.detect.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Télécharger les artefacts Linux
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syntheo-desktop-linux
          path: dist

      - name: Télécharger les artefacts Windows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syntheo-desktop-windows-unsigned
          path: dist

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.deb, dist/*.AppImage, dist/*.msi, dist/*.exe"

      - name: Générer le CHANGELOG
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          {
            echo "## [${VERSION}] - $(date +%Y-%m-%d)"
            echo ""
            echo "### Changements depuis ${LAST_TAG:-le début}"
            echo ""
            git log "${LAST_TAG:+$LAST_TAG..}HEAD" --format="* %s"
            echo ""
            echo "Vérifier un paquet : \`sha256sum -c SHA256SUMS\` (Linux) ou \`Get-FileHash\` avec \`SHA256SUMS-windows\` (Windows), puis \`gh attestation verify <fichier> -R ${GITHUB_REPOSITORY}\`."
          } > changelog-tmp.md
          cat changelog-tmp.md

      - name: Créer le tag et la GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Syntheo Desktop $VERSION" \
            --notes-file changelog-tmp.md \
            --latest
          echo "✅ Release $VERSION publiée."

  notify-failure:
    name: Notification d'échec
    needs: [
      detect,
      gate-version-consistency,
      build,
      build-windows,
      sast,
      publish,
    ]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Commenter l'échec sur la PR ou le commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.detect.outputs.version || 'inconnue' }}
          GATE: ${{ needs.gate-version-consistency.result }}
          BUILD: ${{ needs.build.result }}
          WINDOWS: ${{ needs.build-windows.result }}
          SAST: ${{ needs.sast.result }}
          PUBLISH: ${{ needs.publish.result }}
        with:
          script: |
            const body = [
              `## ❌ Release échouée pour la version ${process.env.VERSION}`,
              '',
              `- **Gate version-consistency** : \`${process.env.GATE}\``,
              `- **Build** : \`${process.env.BUILD}\``,
              `- **Build Windows** : \`${process.env.WINDOWS}\``,
              `- **Gate SAST (CodeQL)** : \`${process.env.SAST}\``,
              `- **Publish** : \`${process.env.PUBLISH}\``,
              '',
              `🔗 Run : ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            if (prs.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: prs[0].number, body });
            } else {
              await github.rest.repos.createCommitComment({ owner, repo, commit_sha: context.sha, body });
            }
