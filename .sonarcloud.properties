# Configuration SonarCloud (analyse automatique).
# - docs/ et .superpowers/ : documentation de conception, pas du code produit.
# - Fichiers générés : bindings Tauri (bindings.gen.ts) et catalogues i18n compilés.
# - *.sql : migrations SQLite append-only et immuables ; l'analyseur PL/SQL les
#   lit mal (nombreux faux positifs NullComparison/DeleteOrUpdate/S1192).
sonar.exclusions=docs/**,.superpowers/**,**/node_modules/**,**/target/**,**/dist/**,**/bindings.gen.ts,**/i18n/locales/**,**/*.sql,scripts/repack-linux-appimage.mjs,scripts/notarize-dmg.mjs,scripts/update-aur-pkgbuild.mjs

# Duplication : les tests, les migrations SQL (append-only) et les fichiers
# générés ne doivent pas pénaliser l'indicateur de duplication.
sonar.cpd.exclusions=**/*.test.*,**/tests/**,**/*.sql,**/bindings.gen.ts,**/i18n/locales/**

# Outillage de build local/CI (non exposé à l'utilisateur final) : les règles
# d'injection d'arguments (S8705) et de path traversal (S8707) sont des faux
# positifs sur ces scripts invoqués avec des arguments de confiance. Les chemins
# sont déjà validés (resolve + containment). L'analyse automatique ne supporte
# pas `sonar.issue.ignore.multicriteria` (multi-valeur), on exclut donc ces
# fichiers via `sonar.exclusions` (ci-dessus), sans masquer le code applicatif.
