# Configuration SonarCloud (analyse automatique).
# - docs/ et .superpowers/ : documentation de conception, pas du code produit.
# - Fichiers générés : bindings Tauri (bindings.gen.ts) et catalogues i18n compilés.
# - *.sql : migrations SQLite append-only et immuables ; l'analyseur PL/SQL les
#   lit mal (nombreux faux positifs NullComparison/DeleteOrUpdate/S1192).
sonar.exclusions=docs/**,.superpowers/**,**/node_modules/**,**/target/**,**/dist/**,**/bindings.gen.ts,**/i18n/locales/**,**/*.sql

# Duplication : les tests, les migrations SQL (append-only) et les fichiers
# générés ne doivent pas pénaliser l'indicateur de duplication.
sonar.cpd.exclusions=**/*.test.*,**/tests/**,**/*.sql,**/bindings.gen.ts,**/i18n/locales/**

# Outillage de build local/CI (non exposé à l'utilisateur final) : les règles
# d'injection d'arguments (S8705) et de path traversal (S8707) sont des faux
# positifs sur ces scripts invoqués avec des arguments de confiance. Les chemins
# sont déjà validés (resolve + containment) ; exclusion ciblée pour restaurer la
# gate `new_security_rating` sans masquer le code applicatif.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/repack-linux-appimage.mjs
sonar.issue.ignore.multicriteria.e2.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/update-aur-pkgbuild.mjs
sonar.issue.ignore.multicriteria.e3.ruleKey=jssecurity:S8705
sonar.issue.ignore.multicriteria.e3.resourceKey=scripts/repack-linux-appimage.mjs
sonar.issue.ignore.multicriteria.e4.ruleKey=jssecurity:S8705
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/notarize-dmg.mjs
