# Configuration SonarCloud (analyse automatique).
# - docs/ et .superpowers/ : documentation de conception, pas du code produit.
# - Fichiers générés : bindings Tauri (bindings.gen.ts) et catalogues i18n compilés.
sonar.exclusions=docs/**,.superpowers/**,**/node_modules/**,**/target/**,**/dist/**,**/bindings.gen.ts,**/i18n/locales/**

# Duplication : les tests, les migrations SQL (append-only) et les fichiers
# générés ne doivent pas pénaliser l'indicateur de duplication.
sonar.cpd.exclusions=**/*.test.*,**/tests/**,**/*.sql,**/bindings.gen.ts,**/i18n/locales/**
