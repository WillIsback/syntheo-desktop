[profile.dev]
incremental = true
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[workspace]
resolver = "2"
exclude = ["crates/tiptap/vendor/mdast_util_to_markdown"]
members = [
  "apps/cli",
  "apps/desktop/src-tauri",
  "crates/*",
  "plugins/*",
]

