[package]
name = "syntheo-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "syntheo"
path = "src/main.rs"

[dependencies]
syntheo-agent-access = { workspace = true }
syntheo-db-app = { workspace = true }
syntheo-db-core = { workspace = true }
syntheo-storage = { workspace = true }

base64 = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
dirs = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-io"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread"] }
url = { workspace = true }

[dev-dependencies]
cli-docs = { path = "../../crates/cli-docs" }
insta = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["client"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tempfile = { workspace = true }
