  <head>
    <meta charset="UTF-8" />
    <meta

    />
    <title>Syntheo</title>
    <script src="/theme-boot.js"></script>
    <style>
      html,
      body,
      #root {
        background: transparent !important;
        background-color: transparent !important;
      }
      html[data-rounded-window] #boot-splash,
      html[data-rounded-window] #root {
        clip-path: inset(0 round 10px);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(50 43% 97%);
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body:has(#root:not(:empty)) #boot-splash {
        display: none;
      }
      html.dark #boot-splash {
        background: hsl(105 7% 11%);
      }
      /* Symbole « Hanko S » en primary (25 % pour la base, plein pour le
         reflet), suivant la palette et le mode : mêmes valeurs que tokens.css. */
      .boot-splash-mark {
        position: relative;
        width: 4.5rem;
        color: hsl(142 36% 30%);
      }
      html.dark .boot-splash-mark {
        color: hsl(142 34% 62%);
      }
      html[data-palette="fuji"] .boot-splash-mark {
        color: hsl(266 31% 42%);
      }
      html[data-palette="fuji"].dark .boot-splash-mark {
        color: hsl(264 42% 72%);
      }
      html[data-palette="enji"] .boot-splash-mark {
        color: hsl(357 50% 42%);
      }
      html[data-palette="enji"].dark .boot-splash-mark {
        color: hsl(355 61% 74%);
      }
      .boot-splash-mark svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .boot-splash-base {
        opacity: 0.25;
      }
      .boot-splash-highlight {
        position: absolute;
        inset: 0;
        -webkit-mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        -webkit-mask-size: 220% 100%;
        mask-size: 220% 100%;
        animation: boot-splash-shimmer 2.4s ease-in-out infinite;
      }
      .boot-splash-detail {
        max-width: 16rem;
        margin: 1.25rem 0 0;
        color: hsl(95 6% 36%);
        font-family:
          "Geist Variable",
          "Geist",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 0.75rem;
        line-height: 1rem;
        text-align: center;
        opacity: 0;
        animation: boot-splash-detail-reveal 0s linear 2s forwards;
      }
      html.dark .boot-splash-detail {
        color: hsl(86 8% 65%);
      }
      /* Palettes (data-palette posé par theme-boot.js) : background et
         muted-foreground de tokens.css, en clair puis en sombre. */
      html[data-palette="fuji"] #boot-splash {
        background: hsl(40 33% 98%);
      }
      html[data-palette="fuji"] .boot-splash-detail {
        color: hsl(268 8% 39%);
      }
      html[data-palette="fuji"].dark #boot-splash {
        background: hsl(260 10% 11%);
      }
      html[data-palette="fuji"].dark .boot-splash-detail {
        color: hsl(266 9% 68%);
      }
      html[data-palette="enji"] #boot-splash {
        background: hsl(60 100% 99%);
      }
      html[data-palette="enji"] .boot-splash-detail {
        color: hsl(17 4% 39%);
      }
      html[data-palette="enji"].dark #boot-splash {
        background: hsl(0 7% 11%);
      }
      html[data-palette="enji"].dark .boot-splash-detail {
        color: hsl(10 7% 67%);
      }
      @keyframes boot-splash-shimmer {
        0% {
          -webkit-mask-position: 120% 0%;
          mask-position: 120% 0%;
        }
        100% {
          -webkit-mask-position: -20% 0%;
          mask-position: -20% 0%;
        }
      }
      @keyframes boot-splash-detail-reveal {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-highlight {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>
