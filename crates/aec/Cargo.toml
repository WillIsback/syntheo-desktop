[package]
name = "aec"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["onnx", "128"]
onnx = ["dep:syntheo-onnx"]
# LocalVQE v1.4-AEC (#293) : frontal adaptatif + masque neuronal ONNX. Désactivé par défaut,
# DTLN reste le modèle de l'application tant que le banc d'essai n'a pas tranché.
localvqe = ["onnx", "dep:serde_json"]
128 = []
256 = []
512 = []

[dependencies]
syntheo-onnx = { workspace = true, optional = true }

realfft = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
clap = { workspace = true, features = ["derive"] }
criterion = { workspace = true }
dasp = { workspace = true }
hound = { workspace = true }
rodio = { workspace = true }
syntheo-audacity = { workspace = true }
syntheo-audio-snapshot = { workspace = true }
syntheo-audio-utils = { workspace = true }

[[example]]
name = "localvqe_bench"
required-features = ["localvqe"]

[[bench]]
name = "aec_bench"
harness = false
