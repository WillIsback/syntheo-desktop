[package]
name = "agent-access"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
syntheo-db-app = { workspace = true }
syntheo-tiptap = { workspace = true }
syntheo-transcript = { workspace = true }

schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["derive", "serde_json"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs", "io-util", "rt"] }
utoipa = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
syntheo-db-core = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
