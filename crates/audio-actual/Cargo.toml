[package]
name = "audio-actual"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
syntheo-aec = { workspace = true }
syntheo-audio = { workspace = true }
syntheo-audio-device = { workspace = true }
syntheo-audio-interface = { workspace = true }
syntheo-audio-sync = { workspace = true }
syntheo-audio-utils = { workspace = true }
syntheo-resampler = { workspace = true }

anyhow = { workspace = true }
futures-util = { workspace = true }
pin-project = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

cpal = { workspace = true }
dasp = { workspace = true }
rodio = { workspace = true }

ebur128 = "0.1.10"
ringbuf = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { workspace = true, features = ["av"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
pipewire = "0.9.2"

[dev-dependencies]
hound = { workspace = true }
rodio = { workspace = true }
serial_test = { workspace = true }
syntheo-audio-utils = { workspace = true }
syntheo-data = { workspace = true }
syntheo-resampler = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
