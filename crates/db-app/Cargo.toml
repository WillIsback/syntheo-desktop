[package]
name = "db-app"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
syntheo-cloudsync = { workspace = true }
syntheo-db-core = { workspace = true }
syntheo-db-migrate = { workspace = true }
syntheo-e2ee = { workspace = true }
syntheo-tiptap = { workspace = true }

base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "macros"] }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[features]
default = []
cli = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
