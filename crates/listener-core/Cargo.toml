[package]
name = "listener-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
specta = ["dep:specta"]
tauri-event = ["specta", "dep:tauri-specta"]

[dependencies]
syntheo-audio = { workspace = true }
syntheo-audio-device = { workspace = true }
syntheo-audio-utils = { workspace = true }
syntheo-device-monitor = { workspace = true }
syntheo-language = { workspace = true }
syntheo-storage = { workspace = true }
syntheo-supervisor = { workspace = true }
syntheo-transcript = { workspace = true }
syntheo-vad-masking = { workspace = true }

owhisper-client = { workspace = true }
owhisper-interface = { workspace = true }

hound = { workspace = true }
syntheo-mp3 = { workspace = true }

ractor = { workspace = true, features = ["async-trait"] }

bytes = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
sysinfo = { workspace = true }
tauri-specta = { workspace = true, optional = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
syntheo-data = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
tracing-subscriber = { workspace = true }
