[package]
name = "listener2-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
specta = ["dep:specta"]
tauri-event = ["specta", "dep:tauri-specta"]

[dependencies]
syntheo-audio-utils = { workspace = true }
syntheo-language = { workspace = true }
syntheo-mp3 = { workspace = true }
syntheo-user-error = { workspace = true }

base64 = { workspace = true }
hound = { workspace = true }

owhisper-client = { workspace = true }
owhisper-interface = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
strum = { workspace = true, features = ["derive"] }
tauri-specta = { workspace = true, optional = true, features = ["derive"] }
tempfile = { workspace = true }
thiserror = { workspace = true }

ractor = { workspace = true, features = ["async-trait"] }

async-stream = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing = { workspace = true }

aspasia = "0.2.1"

[dev-dependencies]
axum = { workspace = true }
reqwest-middleware = { workspace = true }
tokio = { workspace = true, features = ["net", "test-util", "time"] }
