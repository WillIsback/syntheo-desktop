[package]
name = "notification"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["legacy"]
legacy = ["dep:syntheo-notification-macos", "dep:syntheo-notification-linux", "dep:syntheo-notification-windows"]

[dependencies]
tracing = { workspace = true }

syntheo-notification-interface = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
syntheo-notification-macos = { path = "../notification-macos", package = "notification-macos", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
syntheo-notification-linux = { path = "../notification-linux", package = "notification-linux", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
syntheo-notification-windows = { path = "../notification-windows", package = "notification-windows", optional = true }
