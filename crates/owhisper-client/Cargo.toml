[package]
name = "owhisper-client"
version = "0.0.1"
edition = "2024"
license = "MIT"

[features]
default = []

[dependencies]
anlg-language = { workspace = true }
anlg-user-error = { workspace = true }
anlg-ws-client = { workspace = true }

openai-transcription = { workspace = true }
owhisper-interface = { workspace = true }

base64 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
reqwest-middleware = { workspace = true, features = ["json", "multipart"] }
reqwest-tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
anlg-audio-utils = { workspace = true }
anlg-data = { workspace = true }

rodio = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
wiremock = { workspace = true }
