# cargo deny : advisories, licences, crates bannies, sources.
# Les exceptions (ignore) doivent figurer dans .github/security-exceptions.yml.

[graph]
all-features = false

[advisories]
# Crates non maintenues : seulement pour nos dépendances directes (les crates
# gtk-rs non maintenues tirées par Tauri sur Linux sont hors de notre portée).
unmaintained = "workspace"
yanked = "deny"
# Dette héritée d'Anarlog, recensée dans .github/security-exceptions.yml
# (expiration 2027-01-31). Chaque entrée disparaît avec le chantier indiqué.
ignore = [
  # Retirés avec les intégrations cloud / compte (chantier 04d) : jsonwebtoken (api-*, supabase), SDK AWS (s3, bedrock).
  { id = "RUSTSEC-2023-0071", reason = "rsa via jsonwebtoken (api-*, auth) : retiré au chantier 04d" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint via aws-sigv4/elliptic-curve (s3, bedrock, auth) : retiré aux chantiers 04b/04d" },
  { id = "RUSTSEC-2026-0346", reason = "rustls 0.21 via SDK AWS (s3, bedrock) : retiré aux chantiers 04b/04d" },
  { id = "RUSTSEC-2026-0349", reason = "rustls 0.21 via SDK AWS (s3, bedrock) : retiré aux chantiers 04b/04d" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101 via SDK AWS (s3, bedrock) : retiré aux chantiers 04b/04d" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101 via SDK AWS (s3, bedrock) : retiré aux chantiers 04b/04d" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101 via SDK AWS (s3, bedrock) : retiré aux chantiers 04b/04d" },
  { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.101 via SDK AWS (s3, bedrock) : retiré aux chantiers 04b/04d" },
  { id = "RUSTSEC-2026-0258", reason = "h2 0.3 via SDK AWS (s3, bedrock) : retiré aux chantiers 04b/04d" },
  # Inférence embarquée (local-llm, local-stt) et updater Fastrepl : retirés aux chantiers 04b et 04d.
  { id = "RUSTSEC-2026-0367", reason = "zip 2.x (local-llm/local-stt) et 4.x (tauri-plugin-updater) : retirés aux chantiers 04b/04d" },
  { id = "RUSTSEC-2026-0368", reason = "zip 2.x (local-llm/local-stt) et 4.x (tauri-plugin-updater) : retirés aux chantiers 04b/04d" },
  { id = "RUSTSEC-2026-0369", reason = "zip 2.x (local-llm/local-stt) et 4.x (tauri-plugin-updater) : retirés aux chantiers 04b/04d" },
  # Outils de build et de test, absents du binaire livré.
  { id = "RUSTSEC-2025-0111", reason = "tokio-tar via testcontainers (dev-dependency) : non livré" },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml : wayland-scanner (génération au build) et plist/citationberg (fichiers locaux) ; à suivre en amont" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml : wayland-scanner (génération au build) et plist/citationberg (fichiers locaux) ; à suivre en amont" },
  # Plateformes non livrées ou dépendances de Tauri.
  { id = "RUSTSEC-2026-0332", reason = "wasapi : Windows uniquement, non livré (paquets Linux seulement)" },
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 (gtk-rs) tiré par Tauri sur Linux : en attente de la migration GTK4 de Tauri" },
  # Capture audio : correctif = montée de version de ringbuf dans audio-actual (chantier 04c).
  { id = "RUSTSEC-2026-0293", reason = "ringbuf 0.4 utilisé par audio-actual : montée de version au chantier 04c (capture sans disque)" },
]

[licenses]
# Politique : pas de copyleft fort (GPL, AGPL, SSPL).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "Unlicense",
  "LGPL-2.1-or-later",
  "NCSA",
]
confidence-threshold = 0.9
# Crates internes non publiées.
private = { ignore = true }

# Encodeur MP3 de l'enregistrement audio : supprimé avec la règle « aucun audio
# sur disque » (chantier 04c). Exception datée dans .github/security-exceptions.yml.
[[licenses.exceptions]]
crate = "mp3lame-encoder"
allow = ["LGPL-3.0"]

[[licenses.exceptions]]
crate = "mp3lame-sys"
allow = ["LGPL-3.0"]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
# Dépendances git héritées : avertissement, à épingler ou remplacer au fil des chantiers.
unknown-git = "warn"
