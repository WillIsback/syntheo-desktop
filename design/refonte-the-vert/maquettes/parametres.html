<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paramètres Syntheo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* Syntheo · 緑茶 Thé vert, tokens from the design system. Layout: a settings window (sidebar + document-like column), shown on a quiet workbench. */
:root{
  --background:#fbfaf5; --foreground:#262a24; --card:#fffefa; --primary:#316745; --primary-hover:#25553a; --primary-foreground:#fbfaf5;
  --muted:#efeee6; --muted-foreground:#5c6357; --faint:#8f968a; --accent:#e4ede1; --accent-foreground:#25553a;
  --alert:#fbecea; --alert-foreground:#a33237; --alert-border:#f0c9c6; --border:#e4e3d8; --input:#d8d7cb; --recording:#c53d43;
  --bench:#eceae1; --shadow:0 1px 2px rgba(38,42,36,.06),0 14px 44px rgba(38,42,36,.14);
  --font-sans:Geist,system-ui,-apple-system,"Segoe UI",sans-serif; --font-serif:Newsreader,Georgia,serif; --font-mono:"Geist Mono",ui-monospace,monospace;
  color-scheme:light;
}
.dark{
  --background:#1b1e1a; --foreground:#ece9df; --card:#232821; --primary:#7dbf95; --primary-hover:#97ceaa; --primary-foreground:#13251a;
  --muted:#2c322a; --muted-foreground:#a7ad9f; --faint:#7b8274; --accent:#24382b; --accent-foreground:#9fd2b0;
  --alert:#3a1c1d; --alert-foreground:#f0938d; --alert-border:#5a2a2b; --border:#343a32; --input:#3d443a; --recording:#e5675f;
  --bench:#121411; --shadow:0 14px 44px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bench);color:var(--foreground);font-family:var(--font-sans);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 48px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.head h1{font-family:var(--font-serif);font-weight:500;font-size:32px;line-height:1.1}
.head p{color:var(--muted-foreground);max-width:70ch;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:none;border-radius:999px;padding:5px 14px;font-size:13px;color:var(--muted-foreground)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);font-weight:600}
.stage{overflow-x:auto;padding-bottom:4px}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.note{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.note h3{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.note ul{padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
@media (max-width:760px){.notes{grid-template-columns:1fr}}

/* ---- the window ---- */
.win{width:1180px;height:720px;background:var(--background);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.tbar{height:40px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:13px;color:var(--muted-foreground);border-bottom:1px solid var(--border)}
.tbar .back{border:0;background:none;display:flex;gap:6px;align-items:center;color:var(--foreground);font-weight:500;padding:4px 8px;border-radius:6px}
.tbar .back:hover{background:var(--accent)}
.tbar .ctl{margin-left:auto;display:flex;gap:18px;opacity:.6}
.body{flex:1;min-height:0;display:flex}
.side{width:236px;flex:none;border-right:1px solid var(--border);padding:12px 10px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--faint);font-size:14px;background:var(--card)}
.grp h5{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 8px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:7px;font-size:14px;color:var(--foreground)}
.nav svg{color:var(--muted-foreground);flex:none}
.nav:hover{background:var(--muted)}
.nav[aria-current="page"]{background:var(--accent);color:var(--accent-foreground);font-weight:600}
.nav[aria-current="page"] svg{color:var(--accent-foreground)}
.nav .st{margin-left:auto;width:7px;height:7px;border-radius:50%}
.ok{background:var(--primary)} .ko{background:var(--recording)}
.health{margin-top:auto;border-top:1px solid var(--border);padding:10px 8px 2px;font-size:12px;color:var(--muted-foreground);display:flex;flex-direction:column;gap:4px}
.health span{display:flex;align-items:center;gap:8px}
.health i{width:7px;height:7px;border-radius:50%;display:inline-block}
.main{flex:1;min-width:0;overflow:auto}
.page{max-width:720px;padding:36px 48px 64px;display:flex;flex-direction:column;gap:26px}
.page h2{font-family:var(--font-serif);font-weight:500;font-size:36px;line-height:1.1}
.lede{color:var(--muted-foreground);margin-top:6px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h3{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rows{border-top:1px solid var(--border)}
.row{display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--border)}
.row .l{flex:1;min-width:0}
.row .l b{font-weight:500;display:block}
.row .l small{color:var(--muted-foreground);font-size:13px;display:block}
.sw{width:38px;height:22px;border-radius:999px;background:var(--input);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:left .15s}
.sw[aria-checked="true"]{background:var(--primary)}
.sw[aria-checked="true"]::after{left:19px;background:var(--primary-foreground)}
kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--input);border-bottom-width:2px;border-radius:6px;padding:2px 7px;background:var(--card)}
.keys{display:flex;gap:4px}
.sel{border:1px solid var(--input);border-radius:8px;padding:7px 10px;background:var(--card);min-width:220px;font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted-foreground)}
.in{border:1px solid var(--input);border-radius:10px;padding:9px 12px;background:var(--card);font-size:15px;color:var(--foreground);width:100%}
.in.mono{font-family:var(--font-mono);font-size:14px}
.btn{border:1px solid var(--input);background:var(--card);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--muted)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground);font-weight:600}
.btn.pri:hover{background:var(--primary-hover)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted-foreground)}
.link{color:var(--primary);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* server card */
.server{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.status{display:flex;align-items:center;gap:10px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500}
.chip.good{background:var(--accent);color:var(--accent-foreground)}
.chip.bad{background:var(--alert);color:var(--alert-foreground)}
.chip.wait{background:var(--muted);color:var(--muted-foreground)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.banner{border:1px solid var(--alert-border);background:var(--alert);color:var(--alert-foreground);border-radius:10px;padding:10px 14px;font-size:14px}
.urlrow{display:flex;gap:8px}
.urlrow .in{flex:1}
.proto{display:flex;flex-wrap:wrap;gap:6px}
.proto span{border:1px solid var(--border);border-radius:6px;padding:2px 9px;font-size:13px;color:var(--muted-foreground)}
.proto span.on{border-color:var(--primary);color:var(--accent-foreground);background:var(--accent);font-weight:500}
.models{display:flex;flex-direction:column;gap:6px}
.model{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--background);text-align:left;width:100%}
.model .r{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--input);flex:none;display:grid;place-items:center}
.model[aria-checked="true"]{border-color:var(--primary);background:var(--accent)}
.model[aria-checked="true"] .r{border-color:var(--primary)}
.model[aria-checked="true"] .r::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.model b{font-family:var(--font-mono);font-weight:500;font-size:13.5px}
.model small{margin-left:auto;color:var(--muted-foreground);font-size:12px}
details summary{cursor:pointer;color:var(--muted-foreground);font-size:14px}
details[open] summary{margin-bottom:10px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.segm{display:inline-flex;border:1px solid var(--input);border-radius:8px;overflow:hidden}
.segm button{border:0;background:var(--card);padding:6px 12px;font-size:13px;border-left:1px solid var(--input)}
.segm button:first-child{border-left:0}
.segm button[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);font-weight:600}
.try{border:1px dashed var(--input);border-radius:10px;padding:14px;color:var(--muted-foreground);font-size:14px;display:flex;align-items:center;gap:10px}
.avatar{width:64px;height:64px;border-radius:16px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-family:var(--font-serif);font-size:28px}

/* templates */
.tpl{display:flex;flex:1;min-width:0}
.tlist{width:250px;flex:none;border-right:1px solid var(--border);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:14px}
.titem{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:7px;font-size:14px}
.titem:hover{background:var(--muted)}
.titem[aria-current="true"]{background:var(--accent);color:var(--accent-foreground);font-weight:600}
.titem .star{margin-left:auto;color:var(--primary);font-size:12px}
.titem .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tedit{flex:1;min-width:0;overflow:auto}
.tpage{max-width:700px;padding:30px 44px 64px;display:flex;flex-direction:column;gap:20px}
.ttop{display:flex;align-items:center;gap:10px}
.ttop .sp{flex:1}
.ttitle{font-family:var(--font-serif);font-weight:500;font-size:34px;line-height:1.1;border:0;background:none;width:100%;padding:0}
.tdesc{border:0;background:none;width:100%;color:var(--muted-foreground);font-size:15px;padding:0}
.uses{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted-foreground)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--muted);border-radius:6px;padding:2px 8px;color:var(--foreground)}
.tag button{border:0;background:none;color:var(--faint);padding:0;font-size:12px}
.addtag{border:1px dashed var(--input);background:none;border-radius:6px;padding:1px 8px;color:var(--muted-foreground);font-size:13px}
.gen{display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:6px 6px 6px 14px;background:var(--card)}
.gen input{flex:1;border:0;background:none;font-size:14px;outline:none}
.secs{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.srow{display:grid;grid-template-columns:22px 26px 1fr auto;gap:8px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border)}
.srow .h{color:var(--faint);cursor:grab;padding-top:6px;font-size:13px;letter-spacing:-2px}
.srow .num{font-family:var(--font-mono);font-size:12px;color:var(--faint);padding-top:7px}
.srow input.t{border:0;background:none;font-family:var(--font-serif);font-size:20px;font-weight:500;width:100%;padding:0}
.srow input.i{border:0;background:none;color:var(--muted-foreground);font-size:14px;width:100%;padding:2px 0 0}
.srow .x{border:0;background:none;color:var(--faint);padding:6px;border-radius:6px;opacity:0}
.srow:hover .x,.srow:focus-within .x{opacity:1}
.addsec{border:0;background:none;color:var(--primary);font-weight:600;font-size:14px;text-align:left;padding:12px 0}
.prev{border:1px solid var(--border);border-radius:14px;background:var(--card);padding:24px 28px;display:flex;flex-direction:column;gap:8px}
.prev h4{font-family:var(--font-serif);font-weight:500;font-size:22px;margin-top:8px}
.prev p{color:var(--primary);font-size:15px}
.prev .ph{color:var(--faint);font-style:italic;font-size:14px}
.leg{display:flex;gap:16px;font-size:13px;color:var(--muted-foreground)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.sw::after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Paramètres de Syntheo</h1>
      <p>Proposition de refonte dans l'identité Thé vert. La maquette est cliquable : changez de section, testez la connexion au serveur de transcription, modifiez un modèle de compte-rendu.</p>
    </div>
    <div class="seg" role="group" aria-label="Thème"><button id="th-l" aria-pressed="true">Clair</button><button id="th-d" aria-pressed="false">Sombre</button></div>
  </div>
  <div class="stage"><div class="win" id="win"></div></div>
  <div class="notes" id="notes"></div>
</div>
<script>
const I = {
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>',
  wave:'<path d="M2 12h3l3-8 4 16 3-10 2 2h5"/>',
  spark:'<path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  book:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3"/>',
  doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  folder:'<path d="M3 6h6l2 2h10v11H3z"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c1-3.5 3.5-5 7-5s6 1.5 7 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .5 3.5 2 4 5"/>',
  video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  back:'<path d="M15 6l-6 6 6 6"/>'
};
const svg = (k, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

const NAV = [
  ['Moi', [['general','Profil','user'],['appearance','Apparence','sun'],['notifications','Notifications','bell']]],
  ['Mes serveurs', [['stt','Transcription','wave'],['llm','Synthèse','spark']]],
  ['Écrire', [['dictation','Dictée','mic'],['dictionary','Dictionnaire','book']]],
  ['Mes réunions', [['templates','Modèles','doc'],['meetings','Réunions','video'],['calendar','Calendrier','cal'],['folders','Dossiers','folder'],['contacts','Contacts','people']]]
];

const TPL = [
  { g:'Par défaut', id:'auto', n:'Automatique', d:"Syntheo choisit le modèle le plus proche selon le titre, l'agenda et les participants.", uses:[], secs:[], auto:true },
  { g:'Mes favoris', id:'equipe', n:"Point d'équipe", star:true, d:"Réunions récurrentes d'une équipe : avancement, blocages, décisions.", uses:['Hebdo','Équipe RH'], secs:[["Décisions","Ce qui a été tranché, avec la date d'effet si elle est dite."],["Actions","Qui fait quoi, pour quand. Une ligne par action."],["Points ouverts","Questions restées sans réponse."]] },
  { g:'Mes favoris', id:'entretien', n:'Entretien individuel', star:true, d:'Tête-à-tête manager / collaborateur.', uses:['1:1','Manager'], secs:[["Ressenti","Comment la personne décrit sa période, avec ses mots."],["Objectifs","Où en sont les objectifs fixés, ce qui change."],["Suites","Engagements des deux côtés et date du prochain point."]] },
  { g:'Tous les modèles', id:'ca', n:"Conseil d'administration", d:"Pour les conseils d'administration et les sujets de gouvernance.", uses:['Fondateur','PDG','Administrateur'], secs:[["Performance de l'entreprise","Point financier et opérationnel."],["Initiatives stratégiques","Avancement des priorités stratégiques."],["Revue financière","Budget, trésorerie et santé financière."],["Résolutions","Résolutions adoptées, votes et réserves exprimées."],["Actions","Qui fait quoi, pour quand."]] },
  { g:'Tous les modèles', id:'sprint', n:'Point projet / Sprint', d:"Revue d'avancement d'un projet ou d'un sprint.", uses:['Projet'], secs:[["Livré","Ce qui est terminé depuis le dernier point."],["En cours","Ce qui avance et son reste à faire."],["Risques","Blocages et risques, avec leur responsable."]] },
  { g:'Tous les modèles', id:'annuel', n:'Entretien annuel', d:"Bilan de l'année et objectifs de la suivante.", uses:['RH'], secs:[["Bilan","Réalisations marquantes de l'année."],["Compétences","Points forts et axes de progrès."],["Objectifs","Objectifs de l'année à venir, mesurables."],["Formation","Besoins exprimés."]] },
  { g:'Tous les modèles', id:'client', n:'Lancement client', d:"Premier rendez-vous de démarrage avec un client.", uses:['Client'], secs:[["Besoins","Ce que le client attend, avec ses mots."],["Engagements","Ce que nous avons promis, et quand."],["Relances","Prochain contact et pièces à envoyer."]] },
  { g:'Tous les modèles', id:'cours', n:'Notes de cours', d:'Formation ou conférence.', uses:['Formation'], secs:[["Notions clés","Les idées importantes, une par ligne."],["Questions","Questions posées et réponses données."],["Ressources","Liens, livres et documents cités."]] }
];

const S = { page:'stt', dark:false, stt:'down', sttModel:1, llmModel:0, effort:1, sw:{dict:true, live:false, hands:false, notif:true, sound:false}, tpl:'ca', mode:'edit' };

const NOTES = {
  general:[["Ce qui change",["« Général » devient « Profil » : vous seul, sans mention de connexion ni de compte.","Les champs sont groupés par usage et plus étroits, comme un formulaire de document."]],["Pourquoi",["Les infos servent à vous reconnaître dans la transcription (« Vous ») et à signer les comptes-rendus."]],["Retiré",["La phrase « Votre adresse e-mail de connexion est gérée séparément » : il n'y a pas de connexion."]]],
  stt:[["Ce qui change",["Un serveur, une carte : adresse, test, modèle. Plus de liste de fournisseurs à déplier.","« Tester la connexion » détecte le protocole et liste les modèles quand le serveur le permet.","L'état est dit en clair, avec quoi faire en cas d'échec."]],["Pourquoi",["L'employé configure lui-même : il doit savoir en un coup d'œil si ça marche.","Les explications techniques en anglais passent dans « Aide », en français."]],["Dans le code",["Les protocoles restent ceux d'owhisper-client : OpenAI Realtime, vLLM Realtime, NIM WebSocket et gRPC, OpenAI batch.","L'état des deux serveurs est rappelé en bas du menu."]]],
  llm:[["Ce qui change",["« Intelligence » devient « Synthèse » : on dit à quoi ça sert.","Les modèles sont listés par le serveur (/v1/models) et choisis d'un clic.","L'effort de raisonnement devient un sélecteur à 4 positions."]],["Pourquoi",["Un nom de modèle tapé à la main est la première source d'erreur."]],["À garder",["La clé d'API reste dans « Avancé », facultative.","« Réinitialiser » reste, mais discret et confirmé."]]],
  dictation:[["Ce qui change",["Même contenu, en lignes régulières : libellé à gauche, réglage à droite.","Les consignes Wayland / X11 n'apparaissent que sur Linux, repliées.","Un champ d'essai en bas de page."]],["Pourquoi",["La page actuelle mélange réglages, aide système et boutons de navigation."]],["Retiré",["Les trois boutons Autorisations, Langue, Dictionnaire : remplacés par des liens dans les lignes concernées."]]],
  templates:[["Ce qui change",["La liste est rangée : Par défaut, Mes favoris, Tous les modèles.","Un modèle se lit comme le compte-rendu qu'il produira : titre en serif, une ligne par section.","Chaque section = un titre + une consigne d'une ligne, au lieu de grandes zones de texte.","Mode Aperçu : à quoi ressemblera la synthèse."]],["Pourquoi",["L'édition actuelle ressemble à un formulaire ; on ne voit pas le résultat.","« Set as default », « Add tag », « New Template » étaient en anglais."]],["Comportement",["« Utilisé pour » remplace les tags : ce sont les indices qui font choisir ce modèle en mode Automatique.","« Proposer des sections » demande à votre serveur de synthèse de rédiger un premier jet."]]],
  other:[["Hors de cette maquette",["Apparence, Notifications, Dictionnaire, Réunions, Calendrier, Dossiers et Contacts gardent leur contenu actuel, restylé en Thé vert."]],["Retiré",["« Analyses » disparaît du menu, comme convenu."]],["Rangement",["Quatre groupes au lieu de trois : Moi, Mes serveurs, Écrire, Mes réunions."]]]
};

const win = document.getElementById('win');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sw = (k, label) => `<button class="sw" role="switch" aria-checked="${S.sw[k]}" data-sw="${k}" aria-label="${label}"></button>`;

function side() {
  return `<aside class="side"><div class="search">${svg('search',15)} Rechercher un réglage</div>
    ${NAV.map(([g, items]) => `<div class="grp"><h5>${g}</h5>${items.map(([id, n, ic]) => {
      const st = id === 'stt' ? `<span class="st ${S.stt === 'up' ? 'ok' : 'ko'}" aria-label="${S.stt === 'up' ? 'connecté' : 'non connecté'}"></span>` : id === 'llm' ? '<span class="st ok" aria-label="connecté"></span>' : '';
      return `<button class="nav" data-page="${id}" ${S.page === id ? 'aria-current="page"' : ''}>${svg(ic)}${n}${st}</button>`;
    }).join('')}</div>`).join('')}
    <div class="health"><span><i class="${S.stt === 'up' ? 'ok' : 'ko'}"></i>Transcription · ${S.stt === 'up' ? 'connectée' : 'injoignable'}</span><span><i class="ok"></i>Synthèse · connectée</span></div></aside>`;
}

function pGeneral() {
  return `<div class="page"><div><h2>Profil</h2><p class="lede">Ces informations restent sur votre poste. Elles servent à vous reconnaître dans les transcriptions et à signer vos comptes-rendus.</p></div>
  <div style="display:flex;gap:16px;align-items:center"><div class="avatar">T</div><div><b style="font-weight:500">Théo Martin</b><div style="color:var(--muted-foreground);font-size:14px">Chargé RH · Direction des ressources humaines</div></div></div>
  <div class="sec"><h3>Identité</h3><div class="grid2"><label class="f" for="g-n">Nom<input id="g-n" class="in" value="Théo Martin"></label><label class="f" for="g-j">Intitulé du poste<input id="g-j" class="in" value="Chargé RH"></label></div></div>
  <div class="sec"><h3>Coordonnées</h3><div class="grid2"><label class="f" for="g-e">E-mail<input id="g-e" class="in" value="theo.martin@exemple.fr"></label><label class="f" for="g-p">Téléphone<input id="g-p" class="in" placeholder="01 23 45 67 89"></label></div>
  <label class="f" for="g-l">LinkedIn <input id="g-l" class="in" placeholder="linkedin.com/in/…"></label></div>
  <div class="sec"><h3>Langue</h3><div class="rows"><div class="row"><div class="l"><b>Langue des réunions</b><small>Utilisée par défaut pour la transcription.</small></div><select class="sel" aria-label="Langue des réunions"><option>Français</option><option>Anglais</option><option>Détection automatique</option></select></div></div></div></div>`;
}

function pStt() {
  const models = [['parakeet-tdt-0.6b-v3','Multilingue'],['cache-aware-parakeet-rnnt-multi-asr-streaming-sortformer','Multilingue · locuteurs'],['nemotron-asr-streaming','Anglais']];
  const up = S.stt === 'up', test = S.stt === 'test';
  const chip = up ? '<span class="chip good"><i></i>Connecté · 84 ms</span>' : test ? '<span class="chip wait"><span class="spin"></span>Test en cours…</span>' : '<span class="chip bad"><i></i>Injoignable</span>';
  return `<div class="page"><div><h2>Transcription</h2><p class="lede">Le serveur qui transforme la voix en texte, pendant la réunion. L'audio n'est jamais écrit sur le disque.</p></div>
  <div class="server">
    <div class="status"><b style="font-weight:600">Mon serveur</b>${chip}</div>
    ${S.stt === 'down' ? `<div class="banner">Le serveur n'a pas répondu à <b>spark-787d-1…/v1/realtime</b>. Vérifiez qu'il est démarré et que vous êtes sur le bon réseau (VPN, Tailscale), puis relancez le test.</div>` : ''}
    <label class="f" for="s-url">Adresse du serveur</label>
    <div class="urlrow"><input id="s-url" class="in mono" value="https://spark-787d-1.tail6cba9f.ts.net/v1/realtime"><button class="btn ${up ? '' : 'pri'}" data-act="test">${test ? '<span class="spin"></span>' : ''}Tester la connexion</button></div>
    <div class="sec" style="gap:8px"><span style="font-size:13px;font-weight:500;color:var(--muted-foreground)">Protocole ${up ? '<span style="color:var(--accent-foreground)">· détecté automatiquement</span>' : ''}</span>
      <div class="proto">${['OpenAI Realtime','vLLM Realtime','NVIDIA NIM · WebSocket','NVIDIA NIM · gRPC','OpenAI · par lots'].map((p, i) => `<span class="${i === 2 ? 'on' : ''}">${p}</span>`).join('')}</div></div>
    ${up ? `<div class="sec" style="gap:8px"><span style="font-size:13px;font-weight:500;color:var(--muted-foreground)">Modèle</span><div class="models" role="radiogroup" aria-label="Modèle de transcription">${models.map(([m, d], i) => `<button class="model" role="radio" aria-checked="${S.sttModel === i}" data-sttm="${i}"><span class="r"></span><b>${m}</b><small>${d}</small></button>`).join('')}</div>
    <p style="font-size:13px;color:var(--muted-foreground)">NIM ne publie pas sa liste de modèles : ceux-ci sont les modèles connus pour ce protocole. <a class="link" href="#" data-act="noop">Saisir un autre nom</a></p></div>` : ''}
    <details><summary>Avancé</summary><label class="f" for="s-key">Clé d'API (facultative)<input id="s-key" class="in mono" type="password" placeholder="Laisser vide si le serveur n'a pas d'authentification"></label></details>
  </div>
  <div class="rows"><div class="row"><div class="l"><b>Essayer avec ma voix</b><small>Parlez quelques secondes : le texte s'affiche ici, rien n'est conservé.</small></div><button class="btn" ${up ? '' : 'disabled style="opacity:.5;cursor:not-allowed"'}>${svg('mic',15)} Essayer</button></div>
  <div class="row"><div class="l"><b>Aide</b><small>Exemples d'adresses pour vLLM, NIM et Whisper, et comment vérifier un serveur.</small></div><a class="link" href="#" data-act="noop">Ouvrir l'aide</a></div></div></div>`;
}

function pLlm() {
  const models = [['qwen3.8-flash-next-fp4-local','32 k contexte'],['mistral-small-3.2-24b-instruct','128 k contexte'],['llama-3.3-70b-instruct-awq','128 k contexte']];
  return `<div class="page"><div><h2>Synthèse</h2><p class="lede">Le modèle de langage qui rédige vos comptes-rendus et répond quand vous interrogez une note.</p></div>
  <div class="server">
    <div class="status"><b style="font-weight:600">Mon serveur</b><span class="chip good"><i></i>Connecté · 3 modèles disponibles</span></div>
    <label class="f" for="l-url">Adresse du serveur (compatible OpenAI : vLLM, Ollama, llama.cpp, LM Studio)</label>
    <div class="urlrow"><input id="l-url" class="in mono" value="https://spark-787d-1.tail6cba9f.ts.net/v1"><button class="btn">Tester</button></div>
    <div class="sec" style="gap:8px"><span style="font-size:13px;font-weight:500;color:var(--muted-foreground)">Modèle</span><div class="models" role="radiogroup" aria-label="Modèle de synthèse">${models.map(([m, d], i) => `<button class="model" role="radio" aria-checked="${S.llmModel === i}" data-llmm="${i}"><span class="r"></span><b>${m}</b><small>${d}</small></button>`).join('')}</div></div>
    <details><summary>Avancé</summary><div style="display:flex;flex-direction:column;gap:12px"><label class="f" for="l-key">Clé d'API<input id="l-key" class="in mono" type="password" value="sk-local-xxxxxxxxxxxxxxxxxxxx"></label><button class="btn ghost" style="align-self:flex-start;color:var(--alert-foreground)">Réinitialiser ce serveur…</button></div></details>
  </div>
  <div class="rows"><div class="row"><div class="l"><b>Effort de raisonnement</b><small>Plus d'effort donne des synthèses plus fines, mais plus lentes.</small></div>
    <div class="segm" role="group" aria-label="Effort de raisonnement">${['Auto','Faible','Moyen','Élevé'].map((e, i) => `<button aria-pressed="${S.effort === i}" data-effort="${i}">${e}</button>`).join('')}</div></div>
  <div class="row"><div class="l"><b>Modèle de compte-rendu par défaut</b><small>Utilisé quand Syntheo ne sait pas lequel choisir.</small></div><button class="btn" data-page="templates">Point d'équipe ›</button></div></div></div>`;
}

function pDictation() {
  return `<div class="page"><div><h2>Dictée</h2><p class="lede">Parlez dans n'importe quel champ de texte, dans n'importe quelle application. Le texte s'insère quand vous avez terminé.</p></div>
  <div class="rows">
    <div class="row"><div class="l"><b>Activer la dictée</b><small>Syntheo doit rester ouvert pour que le raccourci marche ailleurs.</small></div>${sw('dict','Activer la dictée')}</div>
    <div class="row"><div class="l"><b>Raccourci</b><small>Cliquez pour enregistrer une autre combinaison, Échap pour annuler.</small></div><button class="btn keys" aria-label="Modifier le raccourci Ctrl Alt Espace"><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>Espace</kbd></button></div>
    <div class="row"><div class="l"><b>Mode mains libres</b><small>Maintenez le raccourci pendant que vous parlez, relâchez pour terminer.</small></div>${sw('hands','Mode mains libres')}</div>
    <div class="row"><div class="l"><b>Microphone</b><small>Celui qui capte votre voix. <a class="link" href="#" data-act="noop">Autorisations du système</a></small></div><select class="sel" aria-label="Microphone"><option>Micro par défaut (MacBook)</option><option>Casque Jabra Evolve2</option></select></div>
    <div class="row"><div class="l"><b>Voir le texte en direct</b><small>Les mots s'affichent dans une petite bulle pendant que vous parlez.</small></div>${sw('live','Voir le texte en direct')}</div>
    <div class="row"><div class="l"><b>Langue et vocabulaire</b><small>Français · 42 mots dans votre <a class="link" href="#" data-page="dictionary">dictionnaire</a></small></div><button class="btn" data-page="stt">Serveur de transcription ›</button></div>
  </div>
  <details><summary>Sur Linux (Wayland ou X11)</summary><p style="font-size:14px;color:var(--muted-foreground)">Sur Wayland, acceptez le raccourci dans la fenêtre de votre bureau, puis Ctrl + Alt + Échap pour annuler. Sur X11, Échap suffit. L'application cible doit avoir un champ de texte accessible.</p></details>
  <div class="sec"><h3>Essayer</h3><div class="try">${svg('mic',18)} Placez le curseur ici et appuyez sur <kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>Espace</kbd></div></div></div>`;
}

function pTemplates() {
  const t = TPL.find(x => x.id === S.tpl);
  const groups = [...new Set(TPL.map(x => x.g))];
  const list = `<nav class="tlist" aria-label="Modèles"><div class="search">${svg('search',15)} Rechercher un modèle</div>
    ${groups.map(g => `<div class="grp"><h5>${g}</h5>${TPL.filter(x => x.g === g).map(x => `<button class="titem" data-tpl="${x.id}" aria-current="${x.id === S.tpl}"><span class="n">${x.n}</span>${x.star ? '<span class="star" aria-label="favori">★</span>' : ''}</button>`).join('')}</div>`).join('')}
    <button class="btn" style="justify-content:center" data-act="newtpl">+ Nouveau modèle</button></nav>`;
  let body;
  if (t.auto) {
    body = `<div class="tpage"><div><h2 class="ttitle" style="font-size:34px">Automatique</h2><p class="lede">${t.d}</p></div>
    <div class="rows"><div class="row"><div class="l"><b>Si aucun modèle ne correspond</b><small>Le modèle utilisé en dernier recours.</small></div><select class="sel" aria-label="Modèle de repli"><option>Point d'équipe</option><option>Entretien individuel</option></select></div>
    <div class="row"><div class="l"><b>Me demander avant de rédiger</b><small>Propose le modèle choisi à la fin de l'écoute, avec la possibilité d'en changer.</small></div>${sw('notif','Me demander avant de rédiger')}</div></div></div>`;
  } else {
    const head = `<div class="ttop"><div class="segm" role="group" aria-label="Mode"><button aria-pressed="${S.mode === 'edit'}" data-mode="edit">Modifier</button><button aria-pressed="${S.mode === 'prev'}" data-mode="prev">Aperçu</button></div><span class="sp"></span>
      <button class="btn ghost" data-act="star">${t.star ? '★ Favori' : '☆ Ajouter aux favoris'}</button><button class="btn ghost" aria-label="Plus d'actions">···</button></div>`;
    if (S.mode === 'edit') {
      body = `<div class="tpage">${head}
      <div><input class="ttitle" aria-label="Nom du modèle" value="${esc(t.n)}"><input class="tdesc" aria-label="Description" value="${esc(t.d)}"></div>
      <div class="uses"><span>Utilisé pour</span>${t.uses.map(u => `<span class="tag">${u}<button aria-label="Retirer ${u}">✕</button></span>`).join('')}<button class="addtag">+ Ajouter</button></div>
      <div class="gen">${svg('spark',15)}<input aria-label="Décrire la réunion" placeholder="Décrivez la réunion, Syntheo propose les sections…"><button class="btn">Proposer des sections</button></div>
      <div class="secs">${t.secs.map(([h, i], k) => `<div class="srow"><span class="h" aria-hidden="true">⋮⋮</span><span class="num">${String(k + 1).padStart(2, '0')}</span><div><input class="t" aria-label="Titre de la section ${k + 1}" value="${esc(h)}"><input class="i" aria-label="Consigne de la section ${k + 1}" value="${esc(i)}"></div><button class="x" data-del="${k}" aria-label="Supprimer la section">✕</button></div>`).join('')}
      <button class="addsec" data-act="addsec">+ Ajouter une section</button></div></div>`;
    } else {
      body = `<div class="tpage">${head}
      <div class="leg"><span><i style="background:var(--primary)"></i>Rédigé par Syntheo</span><span><i style="background:var(--faint)"></i>Consigne du modèle</span></div>
      <div class="prev"><h3 style="font-family:var(--font-serif);font-weight:500;font-size:28px">${esc(t.n)} · mardi 29 octobre</h3>
      ${t.secs.map(([h, i]) => `<h4>${esc(h)}</h4><p class="ph">${esc(i)}</p><p>— Exemple de ligne rédigée selon cette consigne.</p>`).join('')}</div></div>`;
    }
  }
  return `<div class="tpl">${list}<div class="tedit">${body}</div></div>`;
}

function pOther(name) {
  return `<div class="page"><div><h2>${name}</h2><p class="lede">Contenu actuel conservé, restylé en Thé vert. Hors du périmètre de cette maquette.</p></div></div>`;
}

function render() {
  document.documentElement.classList.toggle('dark', S.dark);
  document.getElementById('th-l').setAttribute('aria-pressed', String(!S.dark));
  document.getElementById('th-d').setAttribute('aria-pressed', String(S.dark));
  const names = Object.fromEntries(NAV.flatMap(g => g[1]).map(([id, n]) => [id, n]));
  const P = { general:pGeneral, stt:pStt, llm:pLlm, dictation:pDictation, templates:pTemplates }[S.page];
  win.innerHTML = `<div class="tbar"><button class="back">${svg('back',15)} Mes notes</button><span>Paramètres</span><span class="ctl" aria-hidden="true">—&nbsp;&nbsp;▢&nbsp;&nbsp;✕</span></div>
    <div class="body">${side()}<main class="main" style="${S.page === 'templates' ? 'display:flex' : ''}">${P ? P() : pOther(names[S.page])}</main></div>`;
  const nk = NOTES[S.page] || NOTES.other;
  document.getElementById('notes').innerHTML = nk.map(([h, l]) => `<div class="note"><h3>${h}</h3><ul>${l.map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('');
}

win.addEventListener('click', e => {
  const el = e.target.closest('[data-page],[data-sw],[data-act],[data-sttm],[data-llmm],[data-effort],[data-tpl],[data-mode],[data-del]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const d = el.dataset;
  if (d.page) S.page = d.page;
  else if (d.sw) S.sw[d.sw] = !S.sw[d.sw];
  else if (d.sttm) S.sttModel = +d.sttm;
  else if (d.llmm) S.llmModel = +d.llmm;
  else if (d.effort) S.effort = +d.effort;
  else if (d.tpl) { S.tpl = d.tpl; S.mode = 'edit'; }
  else if (d.mode) S.mode = d.mode;
  else if (d.del) TPL.find(x => x.id === S.tpl).secs.splice(+d.del, 1);
  else if (d.act === 'test') { if (S.stt === 'test') return; S.stt = 'test'; render(); setTimeout(() => { S.stt = 'up'; render(); }, 1400); return; }
  else if (d.act === 'addsec') { const t = TPL.find(x => x.id === S.tpl); t.secs.push(['Nouvelle section', 'Décrivez en une ligne ce que Syntheo doit y écrire.']); render(); const ins = win.querySelectorAll('.srow input.t'); ins[ins.length - 1]?.select(); return; }
  else if (d.act === 'star') { const t = TPL.find(x => x.id === S.tpl); t.star = !t.star; }
  else if (d.act === 'newtpl') { const id = 'n' + Date.now(); TPL.push({ g:'Tous les modèles', id, n:'Nouveau modèle', d:'À quoi sert ce modèle ?', uses:[], secs:[['Décisions', 'Ce qui a été tranché.'], ['Actions', 'Qui fait quoi, pour quand.']] }); S.tpl = id; S.mode = 'edit'; }
  else return;
  render();
});
document.getElementById('th-l').onclick = () => { S.dark = false; render(); };
document.getElementById('th-d').onclick = () => { S.dark = true; render(); };
render();
</script>
</body>
</html>
