[package]
name = "tauri-plugin-calendar"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
license = "MIT"
links = "tauri-plugin-calendar"
description = ""

[dependencies]
syntheo-calendar = { workspace = true, features = ["specta"] }
syntheo-calendar-interface = { workspace = true }
syntheo-db-app = { workspace = true }

tauri = { workspace = true, features = ["test"] }
tauri-plugin-db = { workspace = true }
tauri-plugin-permissions = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

chrono = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true, features = ["chrono"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "macros"] }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
specta-typescript = { workspace = true }
syntheo-db-core = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
