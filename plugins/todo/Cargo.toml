[package]
name = "tauri-plugin-todo"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
license = "MIT"
links = "tauri-plugin-todo"
description = ""

[dependencies]
syntheo-api-client = { workspace = true }
syntheo-apple-todo = { workspace = true, features = ["specta"] }
syntheo-github-issues = { workspace = true, features = ["specta"] }
syntheo-http = { workspace = true }
syntheo-ticket-interface = { workspace = true }

tauri = { workspace = true, features = ["test"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

reqwest = { workspace = true }

serde = { workspace = true, features = ["derive"] }
specta = { workspace = true, features = ["chrono"] }
thiserror = { workspace = true }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
specta-typescript = { workspace = true }
