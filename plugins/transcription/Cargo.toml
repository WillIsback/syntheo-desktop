[package]
name = "tauri-plugin-transcription"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
license = "MIT"
links = "tauri-plugin-transcription"
description = ""

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
specta-typescript = { workspace = true }
syntheo-db-core = { workspace = true }

[dependencies]
syntheo-audio = { workspace = true }
syntheo-db-app = { workspace = true }
syntheo-language = { workspace = true }
syntheo-storage = { workspace = true }
syntheo-transcript = { workspace = true }
syntheo-transcription-core = { workspace = true, features = ["specta", "tauri-event"] }

owhisper-client = { workspace = true }
owhisper-interface = { workspace = true }

tauri-plugin-db = { workspace = true }
tauri-plugin-fs-sync = { workspace = true }
tauri-plugin-settings = { workspace = true }
tauri-plugin-store2 = { workspace = true }
tauri-plugin-tray = { workspace = true }

chrono = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

tauri = { workspace = true, features = ["specta", "test"] }

specta = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

ractor = { workspace = true, features = ["async-trait"] }

serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
